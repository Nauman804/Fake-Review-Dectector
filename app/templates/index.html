<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Review Detector</title>
<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: #0ff; /* neon cyan/blue */
        background: linear-gradient(135deg, #00ffff, #0000ff);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .container {
        max-width: 700px;
        padding: 30px;
        background: rgba(0,0,0,0.85);
        border-radius: 15px;
        box-shadow: 0 0 25px #00ffff;
        color: white;
        text-align: center;
    }
    h1 {
        font-weight: bold;
        margin-bottom: 20px;
        color: #00ffff;
        text-shadow: 0 0 10px #00ffff;
    }
    textarea {
        resize: none;
        background: #111;
        color: #0ff;
        border: 2px solid #0ff;
        border-radius: 8px;
        padding: 10px;
        width: 100%;
    }
    button {
        background-color: #0ff;
        color: #000;
        border: none;
        padding: 12px 25px;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
    }
    button:hover {
        box-shadow: 0 0 15px #00ffff;
        transform: scale(1.05);
    }
    .result {
        margin-top: 20px;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 0 10px #fff;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Fake Review Detector</h1>
    <form action="/predict" method="POST" onsubmit="playSound()">
        <textarea name="review" rows="5" placeholder="Write your review here...">{{ review_text if review_text else '' }}</textarea><br><br>
        <button type="submit">Check Review</button>
    </form>

    {% if prediction %}
    <div id="resultBox" class="result">{{ prediction }}</div>
    {% endif %}
</div>

<!-- Sound Logic -->
<audio id="fakeSound" src="{{ url_for('static', filename='error.mp3') }}"></audio>
<audio id="realSound" src="{{ url_for('static', filename='success.mp3') }}"></audio>

<script>
function playSound() {
    setTimeout(function() { // wait for Flask response
        const result = document.getElementById('resultBox');
        if(result) {
            if(result.innerText.includes('Fake')) {
                document.getElementById('fakeSound').play();
            } else if(result.innerText.includes('Genuine')) {
                document.getElementById('realSound').play();
            }
        }
    }, 100); 
}
</script>

</body>
</html>
